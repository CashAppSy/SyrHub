<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SyrHub — لوحة الإدارة</title><link rel="stylesheet" href="/admin/style.css"></head>
<body><header><a href="/">SyrHub</a><span>لوحة الإدارة</span><button id="logout" hidden>تسجيل الخروج</button></header>
<main><p id="status" role="status" aria-live="polite"></p>
<section id="login"><h1>إدارة المساهمات</h1><p>سجّل الدخول بحساب الإدارة لمراجعة الطلبات وتعديلها.</p><form id="loginForm"><label>البريد الإلكتروني<input name="email" type="email" autocomplete="username" required></label><label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">تسجيل الدخول</button></form></section>
<section id="dashboard" hidden><div class="heading"><div><h1>الطلبات المستلمة</h1><p>الموافقة تسجّل القرار. نشر المحتوى في الدليل يتم حالياً عبر ملفات البيانات.</p></div><button id="refresh">تحديث</button></div>
<div class="filters"><label>الحالة<select id="filter"><option value="all">كل الحالات</option><option value="pending">بانتظار المراجعة</option><option value="approved">مقبول</option><option value="rejected">مرفوض</option></select></label><label>بحث في الطلبات المحمّلة<input id="search" type="search" placeholder="اسم، تطبيق، أو وصف"></label></div><p id="count"></p><div class="workspace"><div id="list"></div><section id="editor" hidden><h2>مراجعة الطلب</h2><form id="editForm">
<label>نوع الطلب<select name="type" disabled><option value="app">تطبيق</option><option value="promo">عرض</option><option value="review">تقييم</option></select></label>
<label>اسم المساهم<input name="name" maxlength="100" required></label><label>البريد الإلكتروني<input name="email" type="email" maxlength="254"></label>
<label data-field="title">اسم التطبيق<input name="title" maxlength="150"></label><label data-field="appId">معرّف التطبيق<input name="appId" maxlength="100"></label>
<label data-field="url">الرابط الرسمي<input name="url" type="url" maxlength="1000" dir="ltr"></label><label data-field="rating">التقييم<select name="rating"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label data-field="code">كود العرض<input name="code" maxlength="80"></label>
<label>الوصف<textarea name="description" minlength="10" maxlength="3000" required></textarea></label><label>ملاحظة المراجعة<textarea name="moderationNote" maxlength="2000"></textarea></label>
<label>القرار<select name="status"><option value="pending">بانتظار المراجعة</option><option value="approved">مقبول</option><option value="rejected">مرفوض</option></select></label>
<p id="audit"></p><div class="actions"><button type="submit">حفظ التعديلات والقرار</button><button type="button" data-decision="approved">موافقة وحفظ</button><button type="button" data-decision="rejected" class="danger">رفض وحفظ</button></div></form></section></div><button id="more" hidden>تحميل المزيد</button></section></main><script src="/admin/app.js" defer></script></body></html>
