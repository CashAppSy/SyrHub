plugins { id 'com.android.application' }
def siteUrl = providers.gradleProperty('siteUrl').orElse('https://syrhub.pages.dev/').get()
def uri
try { uri = new URI(siteUrl) } catch (Exception e) { throw new GradleException('Invalid siteUrl') }
if (uri.scheme != 'https' || !uri.host || uri.userInfo || siteUrl.contains('"') || siteUrl.contains('\\')) {
    throw new GradleException('Provide the deployed HTTPS URL with -PsiteUrl=https://your-domain/')
}
android {
    namespace 'com.syrhub.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.syrhub.app'
        minSdk 26
        targetSdk 35
        versionCode 110
        versionName '1.10'
        resValue 'string', 'site_url', siteUrl
    }
}
